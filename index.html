<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./styles.css">
    <title>Tip Calculator</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="main-container">
        <h1 id="heading">Tip Calculator</h1>
        
        <h2 id="bill-amount-heading"><label for="bill-amount">Enter the Bill Amount ($): </label></h2>
        <input type="number" id="bill-amount" min="0">
        <p id="bill-amount-error"></p>

        <h2 id="tip-heading" >Select the tip:</h2>
        <div id="button-grid">
            <button id="ten" class="tip-button">10%</button>
            <button id="fifteen" class="tip-button">15%</button>
            <button id="twenty" class="tip-button">20%</button>
        </div>
        <label for="custom-tip" id="custom-tip-heading"> OR Custom Tip:</label>
        <input type="number" id="custom-tip" min="0">
        <p id="tip-error"></p>
        
        
        <button type="submit" id="calculate">Calculate</button>
        <p id="tip-amount"></p>
        <p id="final-cost"></p>
    </div>
    


    <script src="./script.js"></script>
</body>

</html>
