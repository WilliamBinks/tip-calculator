<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./styles.css">
    <title>Tip Calculator</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="main-container">
        <h1>Tip calculator</h1>
        
        <h2><label for="bill-amount">Enter the Bill Amount: </label></h2>
        <input type="number" id="bill-amount" min="0">
        <p id="bill-amount-error"></p>
        <h2>Select the tip</h2>
        
        <div id="button-grid">
            <button id="ten">10%</button>
            <button id="fifteen">15%</button>
            <button id="twenty">20%</button>
        </div>
        <p id="tip-error"></p>
        
        
        <button type="submit" id="calculate">Calculate</button>
        <p id="final-cost"></p>
    </div>
    


    <script src="./script.js"></script>
</body>

</html>
